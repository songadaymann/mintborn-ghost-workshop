<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mintborn — Ghost study</title>
  <script type="importmap">{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/addons/"}}</script>
  <style>
    :root{font-family:Arial,sans-serif;color:#302e2b;background:#e8e5de;font-size:14px;color-scheme:light}
    *{box-sizing:border-box}body{margin:0}button,input,select{font:inherit;color:inherit;border:1px solid #a9a59b;background:#f2f0e9;border-radius:0}button,select{padding:9px 12px;cursor:pointer}button:hover{background:#fffdf7}button:focus-visible,input:focus-visible,select:focus-visible,canvas:focus-visible{outline:2px solid #39382f;outline-offset:3px}
    h1{font:normal 36px Georgia,serif;margin:0 0 12px;letter-spacing:-1px}p{line-height:1.5;margin:0}a{color:inherit}main{min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr) 310px}#stage{position:relative;min-height:650px;height:100svh;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}
    header{position:absolute;top:32px;left:36px;pointer-events:none}.hint{position:absolute;bottom:28px;left:36px;font-size:12px;color:#57554d;pointer-events:none}aside{border-left:1px solid #bbb6ab;padding:34px 26px;display:flex;flex-direction:column;gap:28px;background:#f2f0e9}fieldset{padding:0;margin:0;border:0}legend{font-weight:bold;margin-bottom:13px}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0;flex:1}.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:12px 0}.swatch{width:100%;aspect-ratio:1;padding:0;border:1px solid #908a7e}.swatch[aria-pressed=true]{outline:2px solid #302e2b;outline-offset:2px}label{display:block;font-size:12px;margin-bottom:7px}select{width:100%}input[type=color]{width:100%;height:38px;padding:3px;cursor:pointer}input[type=range]{width:100%;accent-color:#4d5c4c}input[type=checkbox]{accent-color:#4d5c4c}#gradient-fields{margin-top:12px}.checks{display:flex;gap:18px;margin-top:12px}.checks label{display:flex;align-items:center;gap:5px;margin:0}.footer{margin-top:auto;display:flex;flex-direction:column;gap:12px;font-size:12px}details{border-top:1px solid #bbb6ab;padding-top:13px}summary{cursor:pointer;font-size:12px}.diagnostics{margin-top:12px;display:grid;gap:9px}output{font-size:12px;line-height:1.5;font-variant-numeric:tabular-nums}#status{font-size:12px;min-height:18px}body[data-error=true] #status{color:#9a241f}
    #stage{position:sticky;top:0}button,select{min-height:42px}.swatch{min-height:0}nav{display:flex;gap:18px;margin-top:14px;font-size:12px;pointer-events:auto}#marked-controls{display:grid;gap:10px;margin-top:12px}[hidden]{display:none!important}
    @media(max-width:900px){main{display:block}#stage{position:relative;height:68svh;min-height:540px;display:flex;flex-direction:column}header{position:static;padding:20px 20px 0;flex-shrink:0}#stage canvas{order:1;min-height:0;flex:1}.hint{bottom:18px;left:20px}aside{border-left:0;border-top:1px solid #bbb6ab;padding:22px;display:grid;grid-template-columns:1fr 1fr;gap:24px 18px}aside>fieldset:first-child,.footer,details{grid-column:1/-1}h1{font-size:36px}.swatches{gap:6px}}
  </style>
</head>
<body>
<main>
  <section id="stage" aria-label="Interactive ghost preview">
    <header><h1>Ghost study</h1><p>Mintborn</p><nav><a href="./collection.html">10,000 ghosts</a></nav></header>
    <div class="hint">Drag to float · Arrows to move · Scroll to zoom</div>
  </section>
  <aside aria-label="Ghost traits">
    <fieldset><legend>Fabric</legend>
      <label for="palette">Palette</label><select id="palette"></select>
      <label for="pattern" style="margin-top:12px">Color treatment</label>
      <select id="pattern"><option value="solid">Solid</option><option value="vertical">Vertical gradient</option><option value="diagonal">Diagonal gradient</option><option value="aurora">Aurora</option><option value="rainbow">Rainbow</option></select>
      <div class="swatches" id="swatches" aria-label="Color presets"></div>
      <label for="color-a">Color</label><input type="color" id="color-a" value="#f7f3e9">
      <div id="gradient-fields" hidden><div class="row"><div><label for="color-b">Second color</label><input type="color" id="color-b" value="#9272de"></div><div id="third-color"><label for="color-c">Third color</label><input type="color" id="color-c" value="#efb58a"></div></div></div>
    </fieldset>
    <fieldset><legend>Markings</legend><label for="marking">Fabric marking</label><select id="marking"></select><div id="marked-controls" hidden><div><label for="mark-color">Thread / print color</label><input id="mark-color" type="color" value="#657773"></div><div><label for="mark-scale">Pattern density</label><input id="mark-scale" type="range" min="0.7" max="1.4" step="0.1" value="1"></div></div></fieldset>
    <fieldset><legend>Face</legend><label for="expression">Expression</label><select id="expression"></select></fieldset>
    <fieldset><legend>Accessories</legend><label for="hat">Hat</label><select id="hat"></select><label for="glasses" style="margin-top:15px">Glasses</label><select id="glasses"></select><label for="accessory-color" style="margin-top:15px">Hat color</label><input type="color" id="accessory-color" value="#35433b"></fieldset>
    <fieldset><legend>Movement</legend><label for="softness">Fabric follow-through</label><input id="softness" type="range" min="0.2" max="1" step="0.05" value="0.65"><div class="checks"><label><input id="wander" type="checkbox">Drift</label><label><input id="turn" type="checkbox">Turntable</label></div><button id="reset" style="margin-top:15px;width:100%">Center ghost</button></fieldset>
    <div class="footer"><button id="random">Another ghost</button><div class="row"><button id="save">Save recipe</button><button id="portrait">Save portrait</button></div><div id="status" role="status" aria-live="polite"></div></div>
    <details><summary>Study controls</summary><div class="diagnostics"><label for="style">Art style</label><select id="style"><option value="illustrated">Illustrated cloth</option><option value="soft">Original soft cloth</option></select><label for="quality">Geometry</label><select id="quality"><option value="portrait">Portrait</option><option value="town">Reduced mesh</option></select><label for="debug">View</label><select id="debug"><option value="fabric">Fabric</option><option value="normals">Surface normals</option><option value="motion">Motion weights</option><option value="wire">Wireframe</option></select><output id="metrics"></output><a href="https://x.com/Aaddrriieenn/status/2095442309726826661" target="_blank" rel="noreferrer">Motion reference ↗</a></div></details>
  </aside>
</main>
<script type="module" src="./studio.js?v=classic-body-01"></script>
</body>
</html>
